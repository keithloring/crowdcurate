[project]
name = "crowdcurate"
version = "0.1.0"
description = "A maintainable tkinter slideshow application with MVC architecture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "piexif>=1.1.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pylint>=2.20",
    "ruff>=0.0.300",
    "mypy>=1.6",
    "black>=24.0"
]

[project.scripts]
crowdcurate = "crowdcurate.app:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "RUF",
    "PL",
    "PT",
    "TRY",
    "BLE",
    "EM",
    "S",
    "ANN",
    "TCH",
    "N",
    "D",
    "C90",
]
ignore = [
    "D203",
    "D213",
    "COM812",
    "ISC001",
    "D107",
]
per-file-ignores = { "tests/**" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "ANN001",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN401",
    "S101",
    "E501",
    "ARG001",
    "ARG002",
    "ARG003",
    "ARG005",
    "PLR2004",
    "S108",
    "C901",
    "EM101",
    "TRY003",
    "TC003",
] }

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
python_version = 3.11
strict = true
files = ["src"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = [
    "crowdcurate.sequence",
    "crowdcurate.cache",
    "crowdcurate.view",
    "crowdcurate.controller",
    "crowdcurate.metadata",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
